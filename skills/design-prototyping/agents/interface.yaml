# 通用接口元数据；interface 字段与 openai.yaml 保持一致。
interface:
  display_name: "设计画布原型"
  short_description: "指导设计画布原型的需求分析、结构方案、设计规范、界面状态与标注"
  default_prompt: "使用 $design-prototyping，配合所选设计工具和适用设计能力，制作、完善或验收设计画布原型，按需分析需求、明确规范、形成并审核结构，组织界面与状态，保存相关方案并检查约定范围。"
compatibility:
  canonical_format: "agent-skills"
  # 以下为适配目标声明；本包目前仅有 OpenAI 环境的实际使用证据。
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "agent-skills-compatible"
